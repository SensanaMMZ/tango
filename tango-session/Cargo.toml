[package]
name = "tango-session"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Portable session drivers; live networking is enabled by the netplay feature.
[dependencies]
tango-platform = { path = "../tango-platform" }
tango-net = { path = "../tango-net", optional = true }
bytemuck.workspace = true
chrono = { workspace = true, default-features = true }
log.workspace = true
num-traits.workspace = true
rand.workspace = true
rand_pcg.workspace = true
tango-gamesupport = { path = "../tango-gamesupport" }
tango-match = { path = "../tango-match" }
tango-net-protocol = { path = "../tango-net-protocol" }
tango-replay = { path = "../tango-replay" }
thiserror.workspace = true
# Runtime-neutral synchronization and futures macros only.
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
# `std::time::Instant` panics in a browser; this is the same API backed
# by `performance.now()` there and by std everywhere else.
web-time.workspace = true

[dev-dependencies]
# The custom_probe and bn6_explore examples boot a real BN6 battle from
# the Legacy Collection; nothing in the library itself depends on these.
tango-gamesupport-bn6 = { path = "../tango-gamesupport-bn6", features = ["ram-probe"] }
tango-library = { path = "../tango-library", features = ["native", "gamesupport-bn6"] }
# bn6_explore's screenshots.
image = { workspace = true, features = ["png"] }

[lints]
workspace = true

[features]
default = ["netplay"]
netplay = ["dep:tango-net"]
